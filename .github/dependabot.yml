# Dependabot: a weekly pull request for the crates and one for the workflows' actions, each with
# every minor and patch update in it, and a pull request of its own for each major update. Its
# pull requests go through CI and are reviewed like any other; nothing merges on its own.
#
# The actions stay pinned by commit, with the version in a comment (`@<commit> # v7.0.1`):
# Dependabot moves the commit to the new release's and rewrites the version in the comment.
# dtolnay/rust-toolchain has no releases (it is pinned to a commit of its `stable` branch, which
# its author rebuilds), and the Rust the release is built with is a version in release.yml:
# Dependabot updates neither, so both are moved on by hand at the start of a cycle.
#
# A pull request that changes Cargo.lock also needs THIRD_PARTY_LICENSES.html made again
# (`packaging/notices.sh`), or CI's notices check fails.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      crates:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: Dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: CI
