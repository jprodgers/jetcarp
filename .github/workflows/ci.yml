name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep tests away from the runner's real settings, data and Pictures folders. The Linux test
  # step clears these and checks the default folders stay empty, so a test that would write to a
  # user's own folders fails there.
  JETCARP_CONFIG_DIR: ${{ github.workspace }}/.ci/config
  JETCARP_DATA_DIR: ${{ github.workspace }}/.ci/data
  JETCARP_OUT: ${{ github.workspace }}/.ci/out
  JETCARP_LIBRARY: ${{ github.workspace }}/.ci/library

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04, features: "" }
          - { name: Windows x86_64, os: windows-latest, features: "--features jetcarp/windows-launcher" }
          - { name: macOS arm64, os: macos-latest, features: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries (windowing, plus Mesa's software Vulkan so GPU tests run)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libvulkan1 mesa-vulkan-drivers
      - name: Build
        run: cargo build --workspace --release --all-targets ${{ matrix.features }}
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace --release --no-fail-fast ${{ matrix.features }}
      - name: Test (Linux, with the default folders, failing if a test writes to them)
        if: runner.os == 'Linux'
        env:
          JETCARP_CONFIG_DIR: ""
          JETCARP_DATA_DIR: ""
          JETCARP_OUT: ""
          JETCARP_LIBRARY: ""
        run: |
          cargo test --workspace --release --no-fail-fast ${{ matrix.features }}
          for d in "$HOME/Pictures/JETCARP" "$HOME/.local/share/jetcarp" "$HOME/.config/jetcarp"; do
            if [ -e "$d" ]; then
              echo "::error::a test wrote to $d"
              find "$d" | head -20
              exit 1
            fi
          done

  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check

  notices:
    # THIRD_PARTY_LICENSES.html, which ships in every release, must match Cargo.lock.
    name: Third-party notices are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-about (the version packaging/notices.sh names)
        run: cargo install --locked cargo-about --version 0.9.3 --features cli
      - run: packaging/notices.sh --check

  lint:
    # The workflows (actionlint, with shellcheck on their scripts) and the packaging scripts.
    name: Workflows and packaging scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: actionlint 1.7.12, checked against its release's checksum
        run: |
          v=1.7.12
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_${v}_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "actionlint_${v}_linux_amd64.tar.gz" actionlint
      - name: actionlint
        run: ./actionlint -color
      - name: shellcheck (the installers as POSIX sh, as they run under `curl | sh`)
        run: |
          shellcheck packaging/build.sh packaging/notices.sh packaging/update-manifest-repo.sh
          shellcheck -s sh packaging/install.sh
          shellcheck -s dash packaging/install.sh
      - name: The packaging script's own checks
        run: |
          python3 packaging/package.py verify --tag "v$(python3 packaging/package.py version)" --allow-undated
          python3 packaging/package.py notes --out /tmp/notes.md
          python3 packaging/package.py installers --out /tmp/installers

  build-only:
    # Targets nobody can test by hand yet: compile them so they don't rot.
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: Linux aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libvulkan1
      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}
