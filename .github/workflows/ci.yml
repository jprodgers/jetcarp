name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository: its token can do nothing else.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep tests away from the runner's real settings, data and Pictures folders. The Linux test
  # step clears these and checks the default folders stay empty, so a test that would write to a
  # user's own folders fails there.
  JETCARP_CONFIG_DIR: ${{ github.workspace }}/.ci/config
  JETCARP_DATA_DIR: ${{ github.workspace }}/.ci/data
  JETCARP_OUT: ${{ github.workspace }}/.ci/out
  JETCARP_LIBRARY: ${{ github.workspace }}/.ci/library

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Windows also runs the GPU tests on WARP, a software renderer, which lengthens its test step.
    timeout-minutes: 180
    env:
      # The runners have no GPU: run the GPU tests on a software adapter (Mesa's lavapipe on
      # Linux, WARP on Windows), which JETCARP uses only when asked for; macOS uses the runner's
      # own GPU.
      JETCARP_GPU: software
      # Windows: the tests may choose WARP (JETCARP_ALLOW_WARP, for tests only). Users never get
      # it: the WARP that comes with Windows crashes compiling JETCARP's kernels (#321), so the
      # tests run on Microsoft's newer WARP 1.0.22, put beside the test programs below.
      JETCARP_ALLOW_WARP: ${{ matrix.allow_warp }}
      # Where a GPU is expected (Linux's lavapipe, Windows' WARP, macOS's own GPU), a GPU test that
      # finds no adapter it can use, or one the self-test turns down, fails rather than skipping.
      JETCARP_REQUIRE_GPU: ${{ matrix.require_gpu }}
      # The folder rules' tests make links: on Windows directory junctions and symbolic links
      # (the runner may make both). A link that cannot be made fails the test here, rather than
      # skipping it as on a machine without the rights.
      JETCARP_TEST_LINKS: all
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04, features: "", require_gpu: "1", allow_warp: "" }
          - { name: Windows x86_64, os: windows-latest, features: "--features jetcarp/windows-launcher", require_gpu: "1", allow_warp: "1" }
          # The Intel Mac is built here too, after the tests, on the same runner: GitHub's Apple
          # silicon runners are its scarcest, and a second job for it lost its runner twice on
          # 2026-11-23 (the release's and #328's).
          - { name: macOS arm64, os: macos-latest, features: "", require_gpu: "1", allow_warp: "", also_build: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          targets: ${{ matrix.also_build }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux libraries (windowing, plus Mesa's software Vulkan so GPU tests run, zlib for Golly, librsvg for the icons' check, and desktop-file-validate for the menu entry's)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libvulkan1 mesa-vulkan-drivers zlib1g-dev \
            librsvg2-bin desktop-file-utils
      - name: Golly's bgolly 4.0 and 5.0, built from their source (#145)
        # Ubuntu packages only Golly 3.3, which can't read Larger than Life's R2,C2,S3-6,B3-4
        # notation, so the two versions that matter are built instead: 4.0, the oldest that reads
        # everything JETCARP writes, and 5.0, the newest. Each download is checked against its
        # SHA-256. bgolly needs neither wxWidgets nor Python (Golly's docs/Build.html).
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/golly"
          cd "$RUNNER_TEMP/golly"
          build() {
            local v=$1 sum=$2 src="golly-$1-src"
            curl -fsSL --retry 3 -o "$src.tar.gz" \
              "https://sourceforge.net/projects/golly/files/golly/golly-$v/$src.tar.gz/download"
            echo "$sum  $src.tar.gz" | sha256sum -c -
            tar -xzf "$src.tar.gz"
            make -s -j"$(nproc)" -C "$src/gui-wx" -f makefile-gtk bgolly
            # `bgolly -h` exits with status 10, so its words are read from a file.
            "$src/bgolly" -h > "$src.help" 2>&1 || true
            head -1 "$src.help" | grep -F "This is bgolly $v"
          }
          build 4.0 45a8595c9f7064de029f05d339e3fca3776b5a0c36fef95712e697f154d82ae5
          build 5.0 5835cde428153f9b840ba94a4359e5cb26eb302e7ac01a097cd7f5a5c8303611
      - name: The Windows installer parses, and a refusal is one clean line (#117)
        # Windows PowerShell 5.1, as people run it. Nothing else checks install.ps1.
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\packaging\install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs; exit 1 }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File packaging\install.ps1 -Version 0.4.2 -InstallDir "$env:RUNNER_TEMP\jetcarp-none" -Uninstall 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 1) { Write-Host "exit code $code, expected 1"; exit 1 }
          if ($out -notmatch "jetcarp-installer: no JETCARP installed" -or $out -match "CategoryInfo|FullyQualifiedErrorId") {
            Write-Host "the refusal is not one clean line"; exit 1
          }
          exit 0
      - name: Build
        run: cargo build --workspace --release --all-targets ${{ matrix.features }}
      - name: The Windows installer refuses a tampered download, and one SHA256SUMS does not list
        # The installer a release ships, with the program just built in a release folder of the
        # test's own (packaging/test-install-ps1.ps1).
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python packaging/package.py installers --out "$env:RUNNER_TEMP\installers"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\test-install-ps1.ps1 -Installer "$env:RUNNER_TEMP\installers\jetcarp-installer.ps1" -Program target\release\jetcarp.exe
          exit $LASTEXITCODE
      - name: WARP 1.0.22 beside every program the tests run, so the GPU tests run on Windows (CI only; #321)
        # The WARP that comes with Windows crashes compiling JETCARP's kernels; Microsoft's newer
        # one, from NuGet's Microsoft.Direct3D.WARP, runs them. A program loads d3d10warp.dll from
        # its own folder before the system's, so a copy goes beside each one the build made. It is
        # for the tests only: nothing a release ships is built or packaged here, and this comes
        # after the installer's test, which packages jetcarp.exe on its own.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "1.0.22"
          $sum = "AFC058F4D1066EDC4231A38F3AB3592B1930F7287D4AC700E6A056E0874BB0BE"
          $pkg = "$env:RUNNER_TEMP\warp-$v.nupkg"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/$v/microsoft.direct3d.warp.$v.nupkg" -OutFile $pkg
          $got = (Get-FileHash -Algorithm SHA256 $pkg).Hash
          if ($got -ne $sum) { Write-Host "::error::Microsoft.Direct3D.WARP $v is $got, not $sum"; exit 1 }
          Expand-Archive $pkg -DestinationPath "$env:RUNNER_TEMP\warp-$v"
          $dll = "$env:RUNNER_TEMP\warp-$v\build\native\bin\x64\d3d10warp.dll"
          # The same build as the test step (the workspace, the same features), so nothing rebuilds.
          $exes = cargo test --workspace --release --no-run --message-format=json ${{ matrix.features }} |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { } } |
            Where-Object { $_.reason -eq "compiler-artifact" -and $_.executable } |
            ForEach-Object { $_.executable }
          if ($LASTEXITCODE -ne 0 -or -not $exes) { Write-Host "::error::no test programs listed"; exit 1 }
          $dirs = $exes | ForEach-Object { Split-Path -Parent $_ } | Sort-Object -Unique
          foreach ($d in $dirs) { Copy-Item -LiteralPath $dll -Destination $d }
          Write-Host "WARP $v ($((Get-Item $dll).VersionInfo.FileVersion)) beside $(@($exes).Count) programs in $(@($dirs).Count) folders"
      - name: A temp folder of the tests' own, to check they leave nothing in it (#121)
        shell: bash
        run: |
          base=$RUNNER_TEMP
          # On Windows, a path both bash and the tests read the same way (D:/a/_temp).
          if command -v cygpath >/dev/null; then base=$(cygpath -m "$RUNNER_TEMP"); fi
          d="$base/tests-temp"
          mkdir -p "$d"
          { echo "TMPDIR=$d"; echo "TMP=$d"; echo "TEMP=$d"; } >> "$GITHUB_ENV"
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace --release --no-fail-fast ${{ matrix.features }}
      - name: Test (Linux, with the default folders, failing if a test writes to them)
        if: runner.os == 'Linux'
        env:
          JETCARP_CONFIG_DIR: ""
          JETCARP_DATA_DIR: ""
          JETCARP_OUT: ""
          JETCARP_LIBRARY: ""
        run: |
          # The settings folder exists first, as on any machine that ran JETCARP, so code that
          # writes only into an existing settings folder is caught too.
          mkdir -p "$HOME/.config/jetcarp"
          cargo test --workspace --release --no-fail-fast ${{ matrix.features }}
          rmdir "$HOME/.config/jetcarp" 2>/dev/null || true
          for d in "$HOME/Pictures/JETCARP" "$HOME/.local/share/jetcarp" "$HOME/.config/jetcarp"; do
            if [ -e "$d" ]; then
              echo "::error::a test wrote to $d"
              find "$d" | head -20
              exit 1
            fi
          done
      - name: The folder rules' link tests, each case named (on Windows, junctions and symbolic links)
        # The same build as the test step (the workspace, the same features), so nothing rebuilds.
        run: |
          cargo test --workspace --release ${{ matrix.features }} --test folders -- --nocapture
          cargo test --workspace --release ${{ matrix.features }} --test hostile -- --nocapture a_link_out
      - name: Golly 4.0 and 5.0 read JETCARP's RLE as the same cells and run it to the same generations (#145)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Every Golly test but the library one, which needs a library of finds
          # (JETCARP_GOLLY_LIBRARY), once with each Golly built above.
          for v in 4.0 5.0; do
            echo "::group::Golly $v"
            JETCARP_BGOLLY="$RUNNER_TEMP/golly/golly-$v-src/bgolly" \
              cargo test --workspace --release ${{ matrix.features }} --test golly -- --ignored \
              --skip golly_agrees_on_a_library_s_finds
            echo "::endgroup::"
          done
      - name: The tests left no folders or files of theirs in the temp folder (#121)
        shell: bash
        run: |
          # The macOS screen saver's log is the program's own file there, not a test's.
          left=$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -name 'jetcarp*' ! -name jetcarp-saver.log)
          if [ -n "$left" ]; then
            echo "::error::tests left these in the temp folder:"
            echo "$left"
            exit 1
          fi
      - name: Build (${{ matrix.also_build }}), a target nobody can test by hand, so it doesn't rot
        # Run even when a test failed, so both results show; not when the run was cancelled.
        if: ${{ !cancelled() && matrix.also_build != '' }}
        run: cargo build --workspace --release --target ${{ matrix.also_build }}
      - name: The generated book pages, the keyboard page's table, the rule notation table and the app icon's files match their sources
        if: runner.os == 'Linux'
        run: |
          python3 packaging/gen-icons.py --check
          python3 docs/tools/gen-mcp.py --check --jetcarp target/release/jetcarp
          python3 docs/tools/gen-cli.py --check --jetcarp target/release/jetcarp
          python3 docs/tools/gen-named-rules.py --check --jetcarp target/release/jetcarp
          python3 docs/tools/gen-tiling-catalogue.py --check --jetcarp target/release/jetcarp
          python3 docs/tools/gen-palettes.py --check --jetcarp target/release/jetcarp
          python3 docs/tools/gen-shortcuts.py --check --jetcarp target/release/jetcarp
          python3 docs/tools/check-rule-notation.py --jetcarp target/release/jetcarp

  debug:
    # Release builds check neither arithmetic for overflow nor debug assertions, so the tests run
    # again in the dev profile (optimised a little, its dependencies fully). A WebP bug hid from
    # the release run that way until 0.4.3 (#243).
    name: Test in a debug build (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      JETCARP_GPU: software
      JETCARP_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux libraries (windowing, plus Mesa's software Vulkan so GPU tests run)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libvulkan1 mesa-vulkan-drivers
      - name: Test (debug build)
        run: cargo test --workspace --no-fail-fast

  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check

  clippy:
    # Every clippy warning fails the job, and so does every compiler warning. Which lints are
    # allowed, and why, is written down in the root Cargo.toml's [workspace.lints.clippy]. With the
    # Rust releases are built with (.github/rust-release), not the newest stable: main's ruleset
    # requires this job, so a new Rust's lints arrive only when that version is moved on, at the
    # start of a cycle, never as a surprise on a pull request. Windows' and macOS's code is linted
    # here too, for their targets: clippy only checks the code and never links it, so the C code
    # under SQLite and zstd is "compiled" by stand-ins that write empty files.
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The Rust releases are built with (.github/rust-release)
        id: rust
        run: |
          v=$(sed 's/#.*//' .github/rust-release | tr -d '[:space:]')
          if ! [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.github/rust-release should name one Rust version, such as 1.100.0, not '$v'"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libvulkan1
      - name: Clippy (Linux x86_64; with the Windows launcher's feature, so every program is linted)
        run: cargo clippy --workspace --all-targets --locked --features jetcarp/windows-launcher -- -D warnings
      - name: Stand-in C compilers and archivers for the Windows and macOS targets
        run: |
          d="$RUNNER_TEMP/stand-in"
          mkdir -p "$d"
          # Each writes an empty file where its output would go, and nothing else.
          cat > "$d/cl.exe" <<'EOF'
          #!/bin/sh
          for a in "$@"; do case "$a" in -Fo*|/Fo*) f="${a#?Fo}"; mkdir -p "$(dirname "$f")"; : > "$f";; esac; done
          EOF
          cat > "$d/lib.exe" <<'EOF'
          #!/bin/sh
          for a in "$@"; do case "$a" in -out:*|/OUT:*|-OUT:*|/out:*) f="${a#*:}"; mkdir -p "$(dirname "$f")"; : > "$f";; esac; done
          EOF
          cat > "$d/cc" <<'EOF'
          #!/bin/sh
          o=""; prev=""
          for a in "$@"; do if [ "$prev" = -o ]; then o="$a"; fi; prev="$a"; done
          if [ -n "$o" ]; then mkdir -p "$(dirname "$o")"; : > "$o"; fi
          EOF
          cat > "$d/ar" <<'EOF'
          #!/bin/sh
          for a in "$@"; do case "$a" in *.a) mkdir -p "$(dirname "$a")"; : > "$a"; exit 0;; esac; done
          EOF
          chmod +x "$d"/*
      - name: Clippy (Windows x86_64, checked from Linux)
        env:
          CC_x86_64_pc_windows_msvc: ${{ runner.temp }}/stand-in/cl.exe
          AR_x86_64_pc_windows_msvc: ${{ runner.temp }}/stand-in/lib.exe
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc --features jetcarp/windows-launcher -- -D warnings
      - name: Clippy (macOS arm64, checked from Linux)
        env:
          CC_aarch64_apple_darwin: ${{ runner.temp }}/stand-in/cc
          AR_aarch64_apple_darwin: ${{ runner.temp }}/stand-in/ar
        run: cargo clippy --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings

  notices:
    # THIRD_PARTY_LICENSES.html, which ships in every release, must match Cargo.lock.
    name: Third-party notices are current
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
      - name: cargo-about (the version packaging/notices.sh names)
        run: cargo install --locked cargo-about --version 0.9.3 --features cli
      - run: packaging/notices.sh --check

  lint:
    # The workflows (actionlint, with shellcheck on their scripts) and the packaging scripts.
    name: Workflows and packaging scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint 1.7.12, checked against its release's checksum
        run: |
          v=1.7.12
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_${v}_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "actionlint_${v}_linux_amd64.tar.gz" actionlint
      - name: actionlint
        run: ./actionlint -color
      - name: shellcheck (the installers as POSIX sh, as they run under `curl | sh`)
        run: |
          shellcheck packaging/build.sh packaging/notices.sh packaging/update-manifest-repo.sh packaging/package-repo-keys.sh
          shellcheck -s sh packaging/install.sh packaging/test-install-sh.sh
          shellcheck -s dash packaging/install.sh packaging/test-install-sh.sh
      - name: The packaging script's own checks
        run: |
          python3 packaging/package.py verify --tag "v$(python3 packaging/package.py version)" --allow-undated
          python3 packaging/package.py notes --out /tmp/notes.md
          python3 packaging/package.py installers --out /tmp/installers
      - name: The shell installer refuses a tampered download, and one SHA256SUMS does not list
        run: sh packaging/test-install-sh.sh /tmp/installers/jetcarp-installer.sh

  packages:
    # crates.io builds each crate on its own, with only the features its dependents ask for; in
    # the workspace every crate gets the union of them, which hid a break in jetcarp-api built
    # without `pack` (as jetcarp-script asks for it) until a publish dry run.
    name: The crates package and build on their own (crates.io dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libvulkan1
      - name: The feature sets other crates use
        run: |
          cargo check -p jetcarp-api --no-default-features
          cargo check -p jetcarp-api --no-default-features --features ops
          cargo check -p jetcarp-script --no-default-features
          cargo check -p jetcarp-display --no-default-features
      - name: cargo publish --dry-run (every crate, as the release publishes them)
        run: cargo publish --workspace --locked --dry-run

  msrv:
    # The stated minimum Rust (Cargo.toml's rust-version) must build the workspace: every other
    # job uses the newest stable, which hid that the workspace did not load on 1.95 to 1.98
    # (#175). Keep the toolchain below in step with rust-version. The job's name carries no version,
    # since main's ruleset requires it by name.
    name: The minimum Rust builds the workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libvulkan1
      - name: cargo check, every target, with the locked dependencies
        run: cargo check --workspace --all-targets --locked

  build-only:
    # Targets nobody can test by hand yet: compile them so they don't rot.
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
