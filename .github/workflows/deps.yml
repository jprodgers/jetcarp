# Check the dependency tree with cargo-deny (deny.toml): known vulnerabilities and unsoundness in
# dependencies (the RustSec advisory database), a ban on every network client and server crate
# (SECURITY.md promises that JETCARP makes no network connections), and crates from crates.io
# only. Each target JETCARP releases for is checked on its own, as built for that target alone.
# It runs on every push to main and every pull request, and once a week, because an advisory can
# be published for a dependency without anything here changing.
name: Dependencies

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 11:17 UTC (6:17 AM EST).
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: Advisories, banned crates and sources (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
      - name: cargo-deny 0.21.0, checked against its release's checksum
        run: |
          v=0.21.0
          f="cargo-deny-$v-x86_64-unknown-linux-musl"
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-deny/releases/download/$v/$f.tar.gz"
          echo "a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903  $f.tar.gz" | sha256sum -c -
          tar -xzf "$f.tar.gz" --strip-components=1 "$f/cargo-deny"
      - name: cargo deny check, once for each target in deny.toml (unmaintained crates are warnings, never failures)
        # Given every target at once, cargo-deny merges them into one graph and reports crates no
        # target builds (#186), so each target is checked on its own. Every target runs, and the
        # step fails at the end if any failed.
        run: |
          targets=$(python3 -c 'import tomllib; print(" ".join(tomllib.load(open("deny.toml", "rb"))["graph"]["targets"]))')
          failed=""
          for t in $targets; do
            echo "::group::$t"
            if ! ./cargo-deny --locked --target "$t" check --warn unmaintained advisories bans sources; then
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::cargo-deny failed for:$failed"
            exit 1
          fi
