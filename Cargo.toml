[workspace]
resolver = "3"
members = ["crates/jetcarp-core", "crates/jetcarp-store", "crates/jetcarp-search", "crates/jetcarp-gpu", "crates/jetcarp-api", "crates/jetcarp-mcp", "crates/jetcarp", "crates/jetcarp-app", "crates/jetcarp-script", "crates/jetcarp-display", "crates/jetcarp-host", "crates/jetcarp-saver", "crates/jetcarp-pack"]
default-members = ["crates/jetcarp-core", "crates/jetcarp-store", "crates/jetcarp-search", "crates/jetcarp-gpu", "crates/jetcarp-api", "crates/jetcarp-mcp", "crates/jetcarp", "crates/jetcarp-app", "crates/jetcarp-script", "crates/jetcarp-display", "crates/jetcarp-host", "crates/jetcarp-saver", "crates/jetcarp-pack"]

[workspace.package]
version = "0.4.3-rc.2"
edition = "2024"
rust-version = "1.95"
authors = ["Jimmie Rodgers <jimmie@jimmieprodgers.com>"]
license = "Unlicense OR MIT"
repository = "https://github.com/jprodgers/jetcarp"
homepage = "https://jprodgers.github.io/jetcarp/"
readme = "README.md"
keywords = ["cellular-automata", "tilings", "aperiodic", "game-of-life", "simulation"]
categories = ["science", "simulation", "mathematics"]
# Every crate but jetcarp-saver goes to crates.io, together and in dependency order, from the
# release workflow's crates.io job, which runs only when switched on (`cargo publish --workspace`).
# Naming the registry also tells cargo-about (packaging/about.toml) that these are JETCARP's own.
publish = ["crates-io"]

# Clippy's policy for every crate (each says `[lints] workspace = true`). CI runs
# `cargo clippy --workspace --all-targets --locked -- -D warnings`, so every lint clippy warns
# about by default is fixed, allowed here for the whole workspace, or allowed with
# `#[allow(clippy::…)]` at the one place it is wrong about. Only these four are allowed throughout:
[workspace.lints.clippy]
# Geometry, rendering and search functions take a tiling, a rule, a field and their settings as
# separate parameters; a struct made only to carry them would not read better.
too_many_arguments = "allow"
# Callbacks, and maps from a tuple to a list of tuples, are written out where they are used.
type_complexity = "allow"
# A cell's index is also its id in the tiling: loops over `0..n` use it as both.
needless_range_loop = "allow"
# `g % 2 == 0` is the arithmetic as written down, and rustfmt spreads the one-line
# `if g.is_multiple_of(2) { a } else { b }` over five lines.
manual_is_multiple_of = "allow"

# The workspace's own crates carry their exact version, which crates.io needs, so a published
# jetcarp always builds with the crates it was released with.
[workspace.dependencies]
jetcarp-core = { path = "crates/jetcarp-core", version = "=0.4.3-rc.2" }
jetcarp-store = { path = "crates/jetcarp-store", version = "=0.4.3-rc.2" }
jetcarp-search = { path = "crates/jetcarp-search", version = "=0.4.3-rc.2" }
jetcarp-gpu = { path = "crates/jetcarp-gpu", version = "=0.4.3-rc.2" }
jetcarp-api = { path = "crates/jetcarp-api", version = "=0.4.3-rc.2", default-features = false }
jetcarp-mcp = { path = "crates/jetcarp-mcp", version = "=0.4.3-rc.2" }
jetcarp-script = { path = "crates/jetcarp-script", version = "=0.4.3-rc.2", default-features = false }
jetcarp-display = { path = "crates/jetcarp-display", version = "=0.4.3-rc.2", default-features = false }
jetcarp-app = { path = "crates/jetcarp-app", version = "=0.4.3-rc.2" }
jetcarp-host = { path = "crates/jetcarp-host", version = "=0.4.3-rc.2" }
jetcarp-pack = { path = "crates/jetcarp-pack", version = "=0.4.3-rc.2" }
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# ECMAScript number formatting for RFC 8785 canonical JSON (an identity text's `tiling=` line).
ryu-js = "1.0.3"
png = "0.18.1"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
# `clipboard`: without it every Copy button and Paste in the app does nothing (#114).
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit", "clipboard"] }
egui-wgpu = "0.37.0"
# Docked panes in the app (targets egui 0.37; its default `serde` feature saves the layout).
egui_tiles = "0.18.0"
# The app reads the monitor list from winit; the version eframe 0.37 uses, so it is not built twice.
winit = { version = "0.30.13", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30.0.1"
pollster = "0.4.0"
rfd = "0.17.2"
dirs = "7.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
flate2 = "1.1.10"
gif = { version = "0.14.2", default-features = false, features = ["std"] }
image-webp = "0.2.4"
# Explore run segments (Parquet): the file format only, zstd only, no Arrow.
parquet = { version = "60.2.0", default-features = false, features = ["zstd"] }
bytes = "1.12"
# Local dates and times: the time zone's offset and the local date (output folders' names,
# records, a machine's score, the rotation's clock). Pure Rust; it reads the system's time zone
# database, and on Windows its own copy of it.
jiff = "1.0.2"

# Simulation code is slow unoptimized; keep debug builds debuggable but usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1

# What the release workflow ships: the release build without debug information, stripped.
[profile.dist]
inherits = "release"
debug = false
strip = true
