[package]
name = "jetcarp-api"
description = "JETCARP's operations layer: what the command line, the MCP server, Rhai scripts, and the app all call, with the argument parsers, output folders, and world host they share. No UI or GPU dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["ops", "pack"]
# The operations and the context they run in, which need the store and the job runner. Without
# it only the argument parsers, output folders, cells, the world host and errors remain: what
# world-only Rhai (jetcarp-script without `api`, so jetcarp-display and the macOS saver) uses.
ops = ["dep:jetcarp-store", "dep:jetcarp-search"]
# Packs (`pack.*`): Arrow and Parquet's Arrow API come with them, so builds without packs (the
# macOS saver, world-only Rhai) never link them.
pack = ["ops", "dep:jetcarp-pack"]

[dependencies]
jetcarp-core.workspace = true
jetcarp-store = { workspace = true, optional = true }
jetcarp-search = { workspace = true, optional = true }
jetcarp-pack = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
png.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
rayon.workspace = true
# JSON Schemas for each operation's input and output (the op registry, `jetcarp api schema`,
# and later the MCP tools' input schemas).
schemars = "1.2.3"
