[package]
name = "jetcarp-app"
description = "JETCARP desktop app (egui + wgpu)."
version.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
jetcarp-core.workspace = true
jetcarp-store.workspace = true
jetcarp-search.workspace = true
jetcarp-api = { workspace = true, features = ["default"] }
jetcarp-gpu.workspace = true
jetcarp-display = { workspace = true, features = ["default"] }
eframe.workspace = true
egui-wgpu.workspace = true
egui_tiles.workspace = true
winit.workspace = true
serde.workspace = true
dirs.workspace = true
bytemuck.workspace = true
serde_json.workspace = true
rfd.workspace = true
jetcarp-mcp.workspace = true
jetcarp-script = { workspace = true, features = ["default"] }
png.workspace = true
clap.workspace = true

[dev-dependencies]
# Offscreen pictures of tool windows in tests (`src/offscreen.rs`); already in the tree.
pollster.workspace = true

# macOS: ⌘M minimises through AppKit's `miniaturize:` (`src/macwin.rs`, #131). objc2 is already
# in the tree: the host, the display crate and the screen saver use it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

# Windows: the system's reduced motion and contrast themes (`src/a11y.rs`, #218, #220), through
# `SystemParametersInfoW`. windows-sys is already in the tree (the display crate uses it).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

# Keep-awake (`src/keepawake.rs`): the XDG portal and session bus. zbus 5 is already in the
# tree through AccessKit, so this adds no new crates.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
