[package]
name = "jetcarp-app"
description = "JETCARP desktop app (egui + wgpu)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
jetcarp-core.workspace = true
jetcarp-gpu.workspace = true
jetcarp-display.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
egui_tiles.workspace = true
winit.workspace = true
serde.workspace = true
dirs.workspace = true
bytemuck.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rfd.workspace = true
jetcarp-mcp.workspace = true
jetcarp-script.workspace = true
png.workspace = true
clap.workspace = true

[dev-dependencies]
# Offscreen pictures of tool windows in tests (`src/offscreen.rs`); already in the tree.
pollster.workspace = true

# Keep-awake (`src/keepawake.rs`): the XDG portal and session bus. zbus 5 is already in the
# tree through AccessKit, so this adds no new crates.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
