[package]
name = "jetcarp-core"
description = "JETCARP engine: tilings, cell fields, cellular automata, commands, scenes. No UI or GPU dependencies."
version.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
rayon.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
ryu-js.workspace = true
png.workspace = true
dirs.workspace = true
flate2.workspace = true
gif.workspace = true
image-webp.workspace = true

# Reading the machine's memory, processor and GPU memory (`src/machine/hardware.rs`), and the
# processor's and the GPU's load as the score is measured (`src/machine/quiet.rs`,
# `src/machine/gpu_load.rs`: PDH's GPU engine counters on Windows, IOKit on macOS, NVML opened
# with dlopen on Linux): bindings only, already in the dependency tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2.191"
