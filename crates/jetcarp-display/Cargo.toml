[package]
name = "jetcarp-display"
description = "JETCARP display engine: draws worlds with wgpu, steps them on the GPU, and holds scene profiles. No window toolkit, so a wallpaper, a screensaver, or the app can all use it."
version.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["library"]
# Quick Start entries a rotation names are found in the user's library (the background host;
# installing the macOS saver, which bakes them in). The saver itself is built without it.
library = ["dep:jetcarp-store"]

[dependencies]
jetcarp-core.workspace = true
jetcarp-store = { workspace = true, optional = true }
jetcarp-gpu.workspace = true
# World-only: rotations need only the series expansion and the argument parsers.
jetcarp-script = { workspace = true, default-features = false }
wgpu.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
rhai = { version = "=1.27.0", features = ["sync", "serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
dirs.workspace = true
# The caption on surfaces with no egui: glyph drawing, and the font the app already ships.
ab_glyph = "0.2.32"
epaint_default_fonts = "0.37.0"

[dev-dependencies]
pollster.workspace = true
jetcarp-store.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
