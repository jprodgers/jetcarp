[package]
name = "jetcarp-display"
description = "JETCARP display engine: draws worlds with wgpu, steps them on the GPU, and holds scene profiles. No window toolkit, so a wallpaper, a screensaver, or the app can all use it."
version.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = ["library"]
# Quick Start entries a rotation names are found in the user's library (the background host;
# installing the macOS saver, which bakes them in). The saver itself is built without it.
library = ["dep:jetcarp-store"]

[dependencies]
jetcarp-core.workspace = true
jetcarp-store = { workspace = true, optional = true }
jetcarp-gpu.workspace = true
# World-only: rotations need only the series expansion and the argument parsers.
jetcarp-script.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
rhai = { version = "=1.27.0", features = ["sync", "serde"] }
jiff.workspace = true
dirs.workspace = true
# The caption on surfaces with no egui: the fonts egui ships (Ubuntu Light behind Atkinson).
epaint_default_fonts = "0.37.0"
# Reading fonts: installed fonts' names and character maps, a chosen font file's check
# (`src/fonts.rs`), and the caption's letters, their sizes and outlines (`src/caption.rs`). egui's
# own font reader, already in the tree through epaint, so this adds no new crates.
skrifa = { version = "0.50.0", default-features = false, features = ["std"] }
# The caption's letters drawn from their outlines: the rasteriser egui draws the app's words with,
# already in the tree through epaint (without its text and PNG parts, which JETCARP doesn't use).
vello_cpu = { version = "0.2.0", default-features = false, features = ["std", "u8_pipeline"] }

[dev-dependencies]
pollster.workspace = true
jetcarp-store.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# The desktop picture on each monitor (`IDesktopWallpaper`, a COM interface, which windows-sys
# leaves out), and the Start menu entry (`IShellLinkW`, whose target is read with the
# FileSystem feature). Already in the tree through wgpu and AccessKit; only features are added.
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
# The user's id and home folder, for registering the login item with launchd (#99).
libc = "0.2.191"
