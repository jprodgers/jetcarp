[package]
name = "jetcarp-host"
description = "JETCARP background host: runs live scenes without the app window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
jetcarp-core.workspace = true
jetcarp-gpu.workspace = true
jetcarp-display.workspace = true
jetcarp-mcp.workspace = true
clap.workspace = true
serde_json.workspace = true
wgpu.workspace = true
pollster.workspace = true
# `rwh_06` for the wgpu surface; the display protocols the app's eframe build also enables.
winit = { workspace = true, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
memory-stats = "1.2.0"

# Linux gets its menu from the GNOME Shell extension (PLAN.md wave 5), so it needs no GTK.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
] }
