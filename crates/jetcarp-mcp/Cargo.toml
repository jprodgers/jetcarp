[package]
name = "jetcarp-mcp"
description = "JETCARP's MCP (Model Context Protocol) server over the operations layer: tools, the book as resources, JSON-RPC handling, and the local app link. Transport independent; shared by the jetcarp program and the app."
version.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
dirs = { workspace = true }
jetcarp-core.workspace = true
jetcarp-store.workspace = true
jetcarp-search.workspace = true
jetcarp-api = { workspace = true, features = ["default"] }
jetcarp-script = { workspace = true, features = ["default"] }
serde.workspace = true
serde_json.workspace = true
# The local link's token: 128 bits from the operating system's random source (pure Rust).
getrandom = "0.4.3"
# The HTTP endpoint (`jetcarp mcp --http`, #115): parses request heads only. The server around it
# (sockets, limits, timeouts, sessions) is JETCARP's own, in src/http.rs. Pure Rust, no
# dependencies of its own.
httparse = "1.10.1"

[[bin]]
name = "jetcarp-mcp"
path = "src/main.rs"
