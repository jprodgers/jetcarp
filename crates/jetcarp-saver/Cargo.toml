[package]
name = "jetcarp-saver"
description = "JETCARP's macOS screen saver: the code inside JETCARP.saver, which macOS loads into its own screen saver process. Empty on other systems."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "macos")'.dependencies]
jetcarp-core.workspace = true
jetcarp-gpu.workspace = true
# Without its library: the saver's scenes are baked into the bundle, and a sandboxed saver
# could not read the library anyway. So the saver links no store, job runner or SQLite.
jetcarp-display = { workspace = true, default-features = false }
serde_json.workspace = true
wgpu.workspace = true
pollster.workspace = true
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-screen-saver = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView"] }
