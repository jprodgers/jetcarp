[package]
name = "jetcarp-script"
description = "JETCARP's scripting engine (Rhai): worlds, runs, renders, and parallel rule sweeps into output folders, with a host API for the CLI, the app, and the MCP server. No UI or GPU dependencies."
version.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["api"]
# Scripts with the whole host API: worlds, the library, searches, media, and every operation.
# Without it only the series expansion and the shared argument parsers remain (what
# jetcarp-display uses for rotations), so the macOS saver links no store, job runner or SQLite.
api = ["jetcarp-api/ops", "dep:jetcarp-store", "dep:jetcarp-search"]

[dependencies]
jetcarp-core.workspace = true
jetcarp-store = { workspace = true, optional = true }
jetcarp-search = { workspace = true, optional = true }
jetcarp-api = { workspace = true, default-features = false }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
png.workspace = true
rhai = { version = "=1.27.0", features = ["sync", "serde"] }
dirs.workspace = true
