[package]
name = "jetcarp-search"
description = "JETCARP's searches: the job runner (specs, strategies, runner, handles, registry, budgets) and every strategy (soup hunts, bounded soup searches, explore, evolve, ants, movers, census, collisions, sandpiles), the dashboard's logic, and atlas publishing. No UI or GPU dependencies."
version.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
jetcarp-core.workspace = true
jetcarp-store.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
rusqlite.workspace = true
flate2.workspace = true
memory-stats = "1.2.0"
parquet.workspace = true
bytes.workspace = true

# proc_pid_rusage: the process's physical footprint, which macOS's memory readings use (#80).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

# mallopt: the memory test keeps every free in glibc's arenas, so the search must give it back.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dev-dependencies]
libc = "0.2.191"

[dev-dependencies]
# The GPU strategies' tests: a hunt and an explore search on the GPU equal the CPU's.
jetcarp-gpu.workspace = true
