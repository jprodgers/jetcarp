[package]
name = "jetcarp"
description = "JETCARP (Jimmie's Euclidean Tilings and Cellular Automata Research Program): cellular automata on square, hexagonal, Archimedean, k-uniform, isohedral and aperiodic tilings. One program: the app, the command line, the background host and the MCP server."
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[[bin]]
name = "jetcarp"
path = "src/main.rs"

# Windows only: a console-free launcher for shortcuts, login and the .scr screen saver.
[[bin]]
name = "jetcarpw"
path = "src/bin/jetcarpw.rs"
required-features = ["windows-launcher"]

[features]
windows-launcher = []

[dependencies]
jetcarp-core.workspace = true
jetcarp-store.workspace = true
jetcarp-search.workspace = true
jetcarp-api = { workspace = true, features = ["default"] }
jetcarp-gpu.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
jetcarp-mcp.workspace = true
jetcarp-display = { workspace = true, features = ["default"] }
jetcarp-script = { workspace = true, features = ["default"] }
jetcarp-app.workspace = true
jetcarp-host.workspace = true
rayon.workspace = true

# The terminal's width, so a progress line redrawn in place fits it (#104): ioctl(TIOCGWINSZ) on
# Unix, GetConsoleScreenBufferInfo on Windows. Both are bindings only, already in the dependency
# tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

# The Windows tests of a sign-out (`tests/session_end.rs`, #319) find a program's hidden session
# window and send it what Windows sends: bindings only, the dependency above.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
