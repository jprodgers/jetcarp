# cargo-deny's checks of the dependency tree, run by the Dependencies workflow (deps.yml) on every
# push to main, every pull request and once a week. The licences are not checked here:
# packaging/about.toml handles them.
#
# The crates checked are the ones built for the targets JETCARP releases for (release.yml), with
# every feature on and with the tests' dev-dependencies. CI checks each target on its own
# (`cargo deny --target <target> check`, once for each target below): given them all at once,
# cargo-deny merges them into one graph, and reports crates that no target builds: the tray icon's
# GTK crates, say, since the tray icon is built only for Windows and macOS, and its GTK crates
# only for Linux (#186).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

# Known problems in dependencies, from the RustSec advisory database. A vulnerability fails the
# check, and so does unsoundness anywhere in the tree, not only in direct dependencies. A notice
# that a crate is unmaintained is not a vulnerability: CI runs the check with
# `--warn unmaintained`, so those are warnings in its log and never fail it (#186 lists them).
# Run it the same way, once for each target above:
# `cargo deny --target <target> check --warn unmaintained advisories bans sources`.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
# An ignored advisory that the check no longer meets fails it, so no ignore outlives its reason.
# The check runs once for each target: an ignore for a crate only some targets build fails the
# others.
unused-ignored-advisory = "deny"

# SECURITY.md says that JETCARP makes no network connections, and that the only network sockets
# it opens are local, on 127.0.0.1. So that no networking comes in by accident (a dependency
# update that pulls in an HTTP client, say), no crate that is an HTTP, TLS, DNS, WebSocket or
# peer-to-peer client or server, or an HTTP parser, may enter the tree, directly or through another
# crate, unless an entry below allows it.
#
# Networking is added on purpose: the pull request that adds a network crate allows it here, for
# the one JETCARP crate that uses it, with `wrappers` and a reason, and updates SECURITY.md. The
# first is the MCP server's HTTP endpoint (#115, `jetcarp mcp --http`): `httparse` reads its request
# heads, for jetcarp-mcp only; the server around it is JETCARP's own and listens on 127.0.0.1 alone.
# Online packs and a BitTorrent client (#169, #170) are planned.
#
# Any other crate that pulls an allowed one in still fails the check (tested: httparse allowed for
# jetcarp-mcp passes there, and fails from jetcarp-core). A crate the allowed one brings in that is
# also on the list needs the same, with the allowed crate as its wrapper.
[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # HTTP parsers: allowed for the MCP server's HTTP endpoint only.
    { crate = "httparse", wrappers = ["jetcarp-mcp"], reason = "SECURITY.md: only the MCP server's HTTP endpoint on 127.0.0.1 (#115) reads HTTP" },
    # HTTP clients and servers
    { crate = "reqwest", reason = "SECURITY.md: JETCARP makes no network connections" },
    { crate = "hyper", reason = "SECURITY.md: JETCARP makes no network connections" },
    { crate = "hyper-util", reason = "SECURITY.md: JETCARP makes no network connections" },
