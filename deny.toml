features = [
    { crate = "tokio", deny = ["net"], reason = "SECURITY.md: JETCARP makes no network connections" },
]

# Crates come from crates.io only: no other registry, and no git repositories.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
