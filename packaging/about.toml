# cargo-about's settings for THIRD_PARTY_LICENSES.html, the notices of the Rust libraries that
# JETCARP's release builds contain. Regenerate with `packaging/notices.sh` after Cargo.lock
# changes; CI fails when the committed file is out of date.

# The licences JETCARP accepts in what it ships. A dependency under anything else (GPL, LGPL,
# a licence with no SPDX id) stops the generation until someone decides about it. Where a crate
# offers a choice, the first accepted licence in this list is the one used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# The five release targets: what is built only for other systems is left out.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Tests and build scripts are not in the program.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# JETCARP's own crates are under its own licence (UNLICENSE, LICENSE-MIT), so they are left out:
# they are the ones whose manifests name crates.io as their only registry (`publish`), which no
# dependency from crates.io does.
private = { ignore = true, registries = ["crates-io"] }

# The fonts egui bundles: their licence texts are files of their own in the crate.
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0"

[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
license = "OFL-1.1"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"

[[epaint_default_fonts.clarify.files]]
