<?xml version="1.0" encoding="UTF-8"?>
<!-- JETCARP's app icon: a plain stand-in (a glider on a white tile) until the maintainer's own drawing replaces it. packaging/gen-icons.py makes every raster of it from this file. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="256" height="256" viewBox="0 0 256 256">
  <rect x="8" y="8" width="240" height="240" rx="32" ry="32" fill="#ffffff" stroke="#000000" stroke-width="12"/>
  <!-- A glider, the Game of Life's smallest spaceship: .O. / ..O / OOO -->
  <g fill="#000000">
    <rect x="104" y="48" width="48" height="48" rx="6"/>
    <rect x="160" y="104" width="48" height="48" rx="6"/>
    <rect x="48" y="160" width="48" height="48" rx="6"/>
    <rect x="104" y="160" width="48" height="48" rx="6"/>
    <rect x="160" y="160" width="48" height="48" rx="6"/>
  </g>
</svg>
